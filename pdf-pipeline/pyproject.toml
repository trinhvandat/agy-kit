[project]
name = "sepia-pipeline"
version = "0.1.0"
description = "Sepia PDF → EPUB pipeline (chạy trên máy tính, tách rời app KMP). Mốc 0: detect."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-or-later" }
# PyMuPDF là AGPL-3.0 → pipeline chạy TÁCH RỜI app KMP, app không link AGPL (ADR-004, R-08).
dependencies = [
    # 1.27.x là bản được kiểm chứng trong docs/03-pdf-pipeline.md (mới nhất 1.27.x = 1.27.2.3, 2026-10).
    # Giữ trong dải 1.27.x để khớp tài liệu thiết kế; nâng 1.28/2.0 là quyết định riêng.
    "pymupdf>=1.27.2,<1.28",
]

[project.scripts]
sepia-pipeline = "sepia_pipeline.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sepia_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # PyMuPDF/SWIG phát DeprecationWarning lúc import (không phải lỗi của ta).
    "ignore:builtin type .* has no __module__ attribute:DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
