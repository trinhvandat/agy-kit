[project]
name = "sepia-pipeline"
version = "0.1.0"
description = "Sepia PDF → EPUB pipeline (chạy trên máy tính, tách rời app KMP). Mốc 0: detect; Mốc 1: convert."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-or-later" }
# PyMuPDF + ebooklib đều AGPL-3.0 → pipeline chạy TÁCH RỜI app KMP, app KHÔNG link AGPL
# (ADR-004, R-08). Pipeline chỉ xuất .epub; app chỉ đọc file đó.
dependencies = [
    # 1.27.x là bản được kiểm chứng trong docs/03-pdf-pipeline.md (mới nhất 1.27.x = 1.27.2.3, 2026-10).
    # Giữ trong dải 1.27.x để khớp tài liệu thiết kế; nâng 1.28/2.0 là quyết định riêng.
    "pymupdf>=1.27.2,<1.28",
    # Dựng EPUB từ HTML sạch (ADR-004). 0.20 là bản mới nhất trên PyPI (kiểm 2026-10-26), AGPL-3.0.
    "ebooklib>=0.20,<0.21",
]

[project.optional-dependencies]
# Docling chỉ dùng cho SPIKE-4 (so sánh thử nghiệm, CHƯA thay pipeline) — không cài mặc định vì
# kéo theo torch/transformers rất nặng. Cài khi cần: `uv sync --extra docling`.
# 2.142.1 là bản mới nhất trên PyPI (kiểm 2026-10-26); MIT.
docling = ["docling>=2.142,<3"]

[project.scripts]
sepia-pipeline = "sepia_pipeline.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    # epubcheck đóng gói sẵn jar (cần Java) — dùng để kiểm EPUB đầu ra. 5.3.0 = bản mới nhất
    # (kiểm 2026-10-26). Nếu không có Java, quality.py chỉ ghi "chưa kiểm epubcheck".
    "epubcheck>=5.3.0",
    # Pillow: đường ảnh heuristic trong build_epub (resize/chuyển JPEG/bỏ ảnh tí hon) dùng PIL với
    # dự phòng "thiếu Pillow → giữ PNG nguyên". Trước đây PIL chỉ có mặt nhờ docling kéo theo gián
    # tiếp → khai báo tường minh để test ảnh chạy trong CI (uv sync --frozen, KHÔNG cài extra docling).
    "pillow>=11,<14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sepia_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # PyMuPDF/SWIG phát DeprecationWarning lúc import (không phải lỗi của ta).
    "ignore:builtin type .* has no __module__ attribute:DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
