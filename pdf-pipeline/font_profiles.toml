# Hồ sơ font cho cờ --font-profile của lệnh `convert`.
#
# MẶC ĐỊNH (không có cờ): EPUB chỉ ghi `font-family: serif` — app Sepia/biến thể mới quyết định
# font thật khi đọc (docs/03 §8, US-C3). Các profile dưới đây CHỈ để **đọc thử bằng app EPUB
# ngoài** (KOReader…) với font đẹp; pipeline KHÔNG nhúng file font.
#
# `font_family` được ghi thẳng vào CSS `body { font-family: ... }`.

[profiles.dongy]
# Ưu tiên phồn thể (TC) trước giản thể (SC) cho sách Đông y có chèn chữ Hán (docs/variants/dongy.md).
font_family = '"Literata", "Noto Serif", "Noto Serif CJK TC", "Noto Serif CJK SC", serif'

[profiles.serif]
# Serif Latin/Việt phổ thông + CJK fallback hệ thống.
font_family = '"Literata", "Noto Serif", "Noto Serif CJK SC", serif'
