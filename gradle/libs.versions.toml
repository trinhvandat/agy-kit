# Version catalog tập trung cho app KMP (Sepia).
# Phiên bản bám bảng chốt ở docs/05-tech-decisions.md; AGP/Gradle/compileSdk/activity-compose
# được thêm ở Mốc 0 (docs/05 không pin) — kiểm tra nguồn chính thức 2026-10-26.
# Mốc 2 thêm: SQLDelight, Koin, coroutines, serialization, compose-webview-multiplatform.
# Kiểm tra nguồn chính thức lại 2026-10-26 (xem docs/05 ghi chú compat).

[versions]
kotlin = "2.4.20"                 # docs/05: 2.x hiện hành
composeMultiplatform = "1.12.2"   # docs/05: iOS Stable; không cần tự align Kotlin
agp = "9.4.1"                     # mới nhất ổn định (9/2026); AGP ≥ 9.0 bắt buộc tách module app/library KMP
androidxActivity = "1.13.0"       # activity-compose ổn định (3/2026)

# SDK Android (AGP 9.4 hỗ trợ tới API 37)
compileSdk = "37"
targetSdk = "37"
minSdk = "26"

# Mốc 2 — data + reader
sqldelight = "2.3.2"              # docs/05 ADR-002; KMP, SQL type-safe compile-time
koin = "4.2.2"                    # docs/05 ADR-003 (bảng ghi 4.2.1; kiểm 2026-10-26 → 4.2.2 patch mới nhất)
coroutines = "1.11.0"             # docs/05
serialization = "1.9.0"          # docs/05; cần Kotlin 2.2+
# compose-webview-multiplatform 2.0.3 là bản mới nhất (8/2025) nhưng build với Kotlin 2.1.20 / Compose 1.8.0.
# Dự án dùng Kotlin 2.4.20 / CMP 1.12.2 → có khoảng cách; rủi ro tương thích (xem docs/05 ADR-001 ghi chú, docs/06 R-01).
webviewMultiplatform = "2.0.3"

[libraries]
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidxActivity" }

# SQLDelight (ADR-002)
sqldelight-runtime = { module = "app.cash.sqldelight:runtime", version.ref = "sqldelight" }
sqldelight-coroutines = { module = "app.cash.sqldelight:coroutines-extensions", version.ref = "sqldelight" }
sqldelight-driver-android = { module = "app.cash.sqldelight:android-driver", version.ref = "sqldelight" }
sqldelight-driver-native = { module = "app.cash.sqldelight:native-driver", version.ref = "sqldelight" }
sqldelight-driver-jvm = { module = "app.cash.sqldelight:sqlite-driver", version.ref = "sqldelight" }   # test JVM (in-memory)

# Koin (ADR-003)
koin-core = { module = "io.insert-koin:koin-core", version.ref = "koin" }
koin-compose = { module = "io.insert-koin:koin-compose", version.ref = "koin" }
koin-android = { module = "io.insert-koin:koin-android", version.ref = "koin" }
koin-test = { module = "io.insert-koin:koin-test", version.ref = "koin" }

# Coroutines
coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }

# Serialization (JSON cho bridge + meta Markdown)
serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }

# WebView (ADR-001)
webview-multiplatform = { module = "io.github.kevinnzou:compose-webview-multiplatform", version.ref = "webviewMultiplatform" }

[plugins]
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
androidApplication = { id = "com.android.application", version.ref = "agp" }
# AGP 9: KMP không còn dùng chung module với com.android.application → shared dùng library plugin này.
androidKotlinMultiplatformLibrary = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
composeMultiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
# Compose compiler plugin phải cùng version với Kotlin (bắt buộc từ Kotlin 2.0).
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlinSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
sqldelight = { id = "app.cash.sqldelight", version.ref = "sqldelight" }
